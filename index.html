<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010a13">
<title>Pick Automático</title>
<link rel="icon" href="/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<link rel="apple-touch-icon" href="/icone-192.png">
<style>
  /* Visual hextech, o mesmo do painel do PC: azul profundo, ouro do cliente do LoL, cantos cortados */
  :root {
    --fundo: #010a13; --fundo2: #0a1428; --painel: #0e1b2e; --borda: #1e2d46; --texto: #f0e6d2; --fraco: #a09b8c;
    --ouro: #c8aa6e; --ouro-claro: #f0e6d2; --ouro-escuro: #785a28; --azul: #0ac8b9; --verm: #e84057; --ok: #0acbe6;
    --corte: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    --corte-p: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--texto); font: 16px/1.35 "Barlow Semi Condensed", Bahnschrift, "Segoe UI", Roboto, sans-serif; }
  html { background: var(--fundo); }
  body { min-height: 100vh; padding-bottom: 104px; background: radial-gradient(120% 60% at 50% -10%, #12305a55, transparent 60%), linear-gradient(180deg, var(--fundo2), var(--fundo) 55%); }
  [hidden] { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(1,10,19,.92); backdrop-filter: blur(8px); border-bottom: 1px solid transparent;
    border-image: linear-gradient(90deg, transparent, var(--ouro) 20%, var(--ouro) 80%, transparent) 1; }
  #ponto { width: 10px; height: 10px; transform: rotate(45deg); background: var(--verm); flex: none; box-shadow: 0 0 8px var(--verm); }
  #ponto.on { background: var(--azul); box-shadow: 0 0 8px var(--azul); }
  #fila { flex: 1; font-weight: 600; font-size: 17px; color: var(--ouro-claro); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 24px; min-width: 2ch; text-align: right; color: var(--ouro); }
  #timer.pouco { color: var(--verm); }
  main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
  .centro { text-align: center; padding: 22vh 0 0; color: var(--fraco); font-size: 17px; }
  .centro b { display: block; color: var(--ouro-claro); font-size: 30px; font-weight: 700; margin-bottom: 6px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .grande { width: 100%; padding: 18px; font-size: 21px; font-weight: 700; letter-spacing: .04em; clip-path: var(--corte);
    background: linear-gradient(180deg, #f0d79a, var(--ouro) 55%, var(--ouro-escuro)); color: #1a1408; box-shadow: inset 0 0 0 2px #f0e6d255; }
  .grande.ban { background: linear-gradient(180deg, #ff7186, var(--verm) 55%, #8d1c2c); color: #fff; }
  .grande:active { filter: brightness(1.12); }
  .grande:disabled { opacity: .45; }
  #aceitar { padding: 24px; font-size: 26px; animation: pulsar 1.6s ease-in-out infinite; }
  @keyframes pulsar { 50% { filter: brightness(1.18); } }
  @media (prefers-reduced-motion: reduce) { #aceitar { animation: none; } }
  h2 { display: flex; align-items: center; gap: 10px; margin: 20px 0 9px; font-size: 15px; font-weight: 600; color: var(--ouro); }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--ouro-escuro), transparent); }
  .time { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .jog { text-align: center; min-width: 0; }
  .jog .foto { position: relative; aspect-ratio: 1; background: var(--painel); border: 2px solid var(--borda); overflow: hidden; clip-path: var(--corte-p); }
  .jog img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .jog.intent img { opacity: .45; }
  .jog.locked .foto { border-color: var(--ouro); }
  .jog.me .foto { border-color: var(--azul); box-shadow: inset 0 0 12px #0ac8b977; }
  .jog.inimigo.locked .foto { border-color: var(--verm); }
  .jog small { display: block; margin-top: 4px; font-size: 12px; color: var(--fraco); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jog small.c { color: var(--texto); font-weight: 600; }
  .bans { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; color: var(--fraco); }
  .bans img { width: 30px; height: 30px; clip-path: var(--corte-p); filter: grayscale(1) brightness(.7); border: 1px solid var(--verm); }
  #aviso { margin: 16px 0 10px; padding: 12px 14px; clip-path: var(--corte); background: var(--painel); border-left: 3px solid var(--borda); font-weight: 600; font-size: 17px; }
  #aviso.vez { border-left-color: var(--ouro); color: var(--ouro-claro); background: linear-gradient(90deg, #c8aa6e22, var(--painel)); }
  #aviso.vezban { border-left-color: var(--verm); color: #ff9aa7; background: linear-gradient(90deg, #e8405722, var(--painel)); }
  #dica { margin: 0 0 10px; font-size: 14px; color: var(--fraco); }
  #porque { margin: 6px 0 0; font-size: 14px; color: var(--azul); }
  .tira { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tira button { flex: none; width: 56px; padding: 0; background: none; }
  .tira img { width: 56px; height: 56px; clip-path: var(--corte-p); border: 2px solid var(--azul); display: block; }
  #busca { width: 100%; padding: 14px 16px; margin: 6px 0 12px; font: inherit; font-size: 18px; color: var(--texto);
    background: var(--painel); border: 1px solid var(--borda); border-bottom: 2px solid var(--ouro-escuro); outline: none; }
  #busca:focus { border-bottom-color: var(--ouro); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
  .ch { position: relative; padding: 0; background: none; text-align: center; min-width: 0; }
  .ch img { width: 100%; aspect-ratio: 1; object-fit: cover; clip-path: var(--corte-p); border: 2px solid var(--borda); display: block; background: var(--painel); }
  .ch span { display: block; margin-top: 4px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch.sel img { border-color: var(--ouro); filter: brightness(1.15); }
  .ch.sel span { color: var(--ouro); font-weight: 600; }
  .ch.off { opacity: .28; pointer-events: none; }
  .ch.dica img { border-color: var(--azul); }
  /* a colocacao no ranking: no meio da foto, centralizada */
  .ch .lugar { position: absolute; top: 3px; right: 3px; pointer-events: none; }
  .ch .lugar i { font-style: normal; padding: 0 4px; background: rgba(1,10,19,.85); color: var(--ouro); font-size: 11px; font-weight: 600; }
  #meu { display: flex; align-items: center; gap: 16px; padding: 14px 16px; clip-path: var(--corte); background: linear-gradient(90deg, #c8aa6e1f, var(--painel) 60%); border-left: 3px solid var(--ouro); }
  #meu img { width: 92px; height: 104px; flex: none; object-fit: cover; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  #meu small { display: block; color: var(--azul); font-size: 14px; }
  #meu b { font-size: 28px; font-weight: 700; color: var(--ouro-claro); }
  #dado { margin-top: 12px; width: 100%; padding: 13px; clip-path: var(--corte); background: var(--painel); border: 1px solid var(--ouro-escuro); color: var(--ouro-claro); font-weight: 600; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, var(--fundo) 35%); }
  footer > div { max-width: 640px; margin: 0 auto; }
  #sinoBtn { flex: none; margin-right: 4px; padding: 6px 10px; background: var(--painel); border: 1px solid var(--borda); font-size: 15px; clip-path: var(--corte-p); }
  #tipoBtn { flex: none; padding: 7px 14px; background: var(--painel); border: 1px solid var(--ouro-escuro); color: var(--ouro-claro); font-size: 14px; font-weight: 600; clip-path: var(--corte-p); }
  #tipos { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; background: linear-gradient(180deg, var(--fundo2), var(--fundo)); }
  #tipos h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; text-align: center; color: var(--ouro-claro); }
  #tipos button { padding: 18px 18px 18px 20px; clip-path: var(--corte); background: var(--painel); border-left: 3px solid var(--ouro-escuro); font-size: 20px; font-weight: 600; text-align: left; }
  #tipos button:active { border-left-color: var(--ouro); background: #c8aa6e1a; }
  #tipos button small { display: block; font-size: 14px; font-weight: 400; color: var(--fraco); }
  #tipos button.auto { text-align: center; background: none; border: 0; color: var(--azul); font-size: 16px; }
  #instalar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; padding: 10px 12px; clip-path: var(--corte); background: var(--painel); border-left: 3px solid var(--ouro); font-size: 14px; }
  #instalar span { flex: 1; }
  #atualizar { margin-bottom: 12px; padding: 10px 12px; clip-path: var(--corte); background: var(--painel); border-left: 3px solid var(--verm); font-size: 14px; }
  #atualizar a { color: var(--ouro); }
  #instalar button { background: none; color: var(--fraco); font-size: 18px; padding: 4px 8px; }
  #toast { position: fixed; left: 16px; right: 16px; top: 64px; z-index: 9; padding: 12px 14px; clip-path: var(--corte); background: var(--verm); color: #fff; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<header><span id="ponto"></span><span id="fila">Pick Automático</span><span id="timer"></span><button id="sinoBtn" title="Avisos no celular">🔔</button><button id="tipoBtn">Tipo</button></header>
<div id="toast" hidden></div>
<div id="tipos" hidden>
  <h1>Qual partida você vai jogar?</h1>
  <button data-tipo="normal">Normal<small>Só escolher o campeão</small></button>
  <button data-tipo="ranked">Ranqueada / Flex<small>Banir e depois escolher</small></button>
  <button data-tipo="aram">ARAM<small>Seu campeão, opções e banco</small></button>
  <button data-tipo="desordem">ARAM: Desordem<small>Seu campeão, opções e banco</small></button>
  <button data-tipo="auto" class="auto">Deixar o app descobrir sozinho</button>
</div>
<main>
  <div id="instalar" hidden><span>Para virar app: menu <b>⋮</b> do navegador → <b>Adicionar à tela inicial</b>.</span><button id="instalarX">✕</button></div>
  <div id="atualizar" hidden>Deu um erro e já saiu uma versão mais nova do Pick Automático. Baixe de novo no PC: <a id="atualizarLink" target="_blank" rel="noopener"></a></div>
  <div id="parado" class="centro"></div>

  <div id="pronto" hidden>
    <div class="centro" style="padding-top:14vh"><b>Partida encontrada!</b><span id="prontoFila"></span></div>
    <div style="margin-top:28px"><button id="aceitar" class="grande">ACEITAR</button></div>
  </div>

  <div id="cs" hidden>
    <div id="aram" hidden>
      <div id="meu"></div>
      <button id="dado" hidden></button>
      <div id="dicaAram" style="margin-top:12px;font-size:13px;color:var(--fraco)"></div>
      <h2 id="tOpcoes">Suas opções</h2><div id="opcoes" class="grade"></div>
      <h2 id="tBanco">Banco do time</h2><div id="banco" class="grade"></div>
    </div>

    <h2>Seu time</h2><div id="meuTime" class="time"></div>
    <div id="bansMeus" class="bans"></div>
    <div id="blocoInimigo"><h2>Adversários</h2><div id="inimigos" class="time"></div><div id="bansDeles" class="bans"></div></div>

    <div id="draft" hidden>
      <div id="aviso"></div>
      <div id="escolha">
        <div id="dica"></div>
        <div id="sugestoes" class="tira"></div>
        <div id="porque"></div>
        <input id="busca" type="search" placeholder="Digite o nome do campeão" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="grade" class="grade"></div>
      </div>
    </div>
  </div>
</main>
<footer hidden id="rodape"><div><button id="confirmar" class="grande"></button></div></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const limpo = (t) => t.normalize('NFD').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

let K = new URLSearchParams(location.search).get('k') || '';
try { if (K) localStorage.setItem('k', K); else K = localStorage.getItem('k') || ''; } catch {}
const elo = document.createElement('link');
elo.rel = 'manifest'; elo.href = '/manifest.webmanifest?k=' + encodeURIComponent(K);
document.head.appendChild(elo);

let S = { lol: false, phase: 'None' };
let champs = [];          // ordenados por nome
let porId = new Map();
let sel = 0;              // campeao marcado na caixa
let acaoId = null;
let fimTimer = 0;
let gradeSig = '';
let toastT = 0;
let tipo = null;          // escolhido ao abrir o app; null = ainda nao perguntou
const TIPOS = { normal: 'Normal', ranked: 'Ranqueada / Flex', aram: 'ARAM', desordem: 'ARAM: Desordem', auto: 'Automático' };
const modoDe = (cs) => (!tipo || tipo === 'auto' ? cs.mode : (tipo === 'aram' || tipo === 'desordem' ? 'aram' : 'draft'));

function toast(msg) {
  $('toast').textContent = msg; $('toast').hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { $('toast').hidden = true; }, 3500);
}

// o sino: liga/desliga os avisos do app (vale para todos os celulares ligados ao PC)
let sinoLigado = true;
function pintarSino() { $('sinoBtn').textContent = sinoLigado ? '🔔' : '🔕'; $('sinoBtn').style.opacity = sinoLigado ? 1 : 0.5; }
async function lerSino(ligar) {
  try {
    const r = await fetch('/api/celular?k=' + encodeURIComponent(K), ligar === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ligado: ligar }) });
    sinoLigado = !!(await r.json()).ligado; pintarSino();
    if (ligar !== undefined) toast(sinoLigado ? 'Avisos no celular ligados' : 'Avisos no celular desligados');
  } catch { if (ligar !== undefined) toast('Sem conexão com o PC'); }
}

async function api(cmd, corpo) {
  try {
    const r = await fetch(`/api/${cmd}?k=${encodeURIComponent(K)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo || {}) });
    const j = await r.json();
    if (!j.ok) toast(j.erro || 'Não deu certo');
    return j.ok;
  } catch { toast('Sem conexão com o PC'); return false; }
}

async function carregarChamps() {
  try {
    const lista = await (await fetch('/api/champions?k=' + encodeURIComponent(K))).json();
    if (!Array.isArray(lista)) return;
    champs = lista.map((c) => ({ ...c, chave: limpo(c.name) })).sort((a, b) => a.name.localeCompare(b.name, 'pt'));
    porId = new Map(champs.map((c) => [c.id, c]));
    gradeSig = ''; render();
  } catch {}
}

const nome = (id) => (porId.get(id) || { name: '' }).name;
const foto = (id) => `<img src="/icon/${id}" alt="" loading="lazy">`;

// o que o servidor leu da partida e por que um campeao da dica serve
const situacao = (sug) => [...(sug.falta.length ? ['Falta no time: ' + sug.falta.join(', ')] : []), ...(sug.leitura || [])].join(' · ');
function porque(sug, id) {
  const m = (sug.motivos || {})[id];
  return m ? `${nome(id)}: ${m.join(', ')}` : '';
}
const melhorCom = (sug) => sug.champs.find((id) => (sug.motivos || {})[id]) || 0;

function jogador(p, inimigo) {
  const id = p.champ || p.intent;
  const cls = ['jog', inimigo ? 'inimigo' : '', p.me ? 'me' : '', p.locked ? 'locked' : '', !p.champ && p.intent ? 'intent' : ''].join(' ');
  const quem = p.me ? 'Você' : (p.name || p.pos || '');
  return `<div class="${cls}"><div class="foto">${id ? foto(id) : ''}</div>` +
    `<small class="c">${esc(id ? nome(id) : '—')}</small><small>${esc(quem)}</small></div>`;
}

function botaoCh(id, extra, lugar) {
  const selo = lugar ? `<b class="lugar"><i>${lugar}</i></b>` : '';
  return `<button class="ch ${extra || ''}" data-id="${id}">${selo}${foto(id)}<span>${esc(nome(id))}</span></button>`;
}

function renderGrade(cs, alvo) {
  const q = limpo($('busca').value);
  const fora = new Set(cs.fora);
  const pode = new Set(cs.pegaveis);
  const sig = [q, alvo.id, alvo.type, sel, cs.fora.join(), cs.pegaveis.length, champs.length].join('|');
  if (sig === gradeSig) return;
  gradeSig = sig;
  let lista = champs;
  if (q) lista = [...champs.filter((c) => c.chave.startsWith(q)), ...champs.filter((c) => !c.chave.startsWith(q) && c.chave.includes(q))];
  $('grade').innerHTML = lista.map((c) => {
    const off = fora.has(c.id) || (alvo.type === 'pick' && pode.size && !pode.has(c.id));
    return botaoCh(c.id, (off ? 'off ' : '') + (c.id === sel ? 'sel' : ''));
  }).join('') || '<div style="color:var(--fraco)">Nenhum campeão com esse nome.</div>';
}

function renderDraft(cs) {
  const alvo = cs.acao || cs.plano;
  if ((alvo ? alvo.id : null) !== acaoId) { acaoId = alvo ? alvo.id : null; sel = alvo ? alvo.champ : 0; $('busca').value = ''; gradeSig = ''; }
  const av = $('aviso');
  av.className = '';
  if (cs.acao && cs.acao.type === 'ban') { av.textContent = 'Sua vez de BANIR'; av.className = 'vezban'; }
  else if (cs.acao) { av.textContent = 'Sua vez de ESCOLHER'; av.className = 'vez'; }
  else if (cs.eu.locked) av.textContent = 'Travado: ' + nome(cs.eu.champ);
  else if (cs.plano) av.textContent = 'Aguarde sua vez — já pode deixar marcado';
  else av.textContent = 'Aguarde…';

  $('escolha').hidden = !alvo;
  const rod = $('rodape');
  rod.hidden = !(cs.acao && sel);
  if (!alvo) return;

  const ehPick = alvo.type === 'pick';
  const sug = ehPick ? cs.sugestao : { falta: [], champs: [] };
  $('dica').hidden = !sug.champs.length;
  $('sugestoes').hidden = !sug.champs.length;
  $('dica').textContent = situacao(sug) || 'Seus mais jogados';
  $('porque').textContent = porque(sug, sel) || porque(sug, melhorCom(sug));
  $('sugestoes').innerHTML = sug.champs.map((id) => `<button data-id="${id}" title="${esc(nome(id))}">${foto(id)}</button>`).join('');

  renderGrade(cs, alvo);
  if (!rod.hidden) {
    const b = $('confirmar');
    b.className = 'grande' + (ehPick ? '' : ' ban');
    b.textContent = (ehPick ? 'CONFIRMAR ' : 'BANIR ') + nome(sel).toUpperCase();
  }
}

function renderAram(cs) {
  $('rodape').hidden = true;
  const id = cs.eu.champ;
  $('meu').innerHTML = (id ? foto(id) : '') + `<div><small>Seu campeão</small><b>${esc(id ? nome(id) : 'Sorteando…')}</b></div>`;
  $('dado').hidden = !cs.rerolls;
  $('dado').textContent = `Rolar o dado (${cs.rerolls})`;
  const sug = cs.sugestao;
  const dica = new Set(sug.champs.filter((c) => (sug.motivos || {})[c]));
  $('dicaAram').textContent = dica.size ? [situacao(sug), 'Os de borda azul ajudam', porque(sug, melhorCom(sug))].filter(Boolean).join(' · ') : '';
  const lista = (ids) => ids.map((c) => botaoCh(c, dica.has(c) ? 'dica' : '', (cs.lugares || {})[c])).join('');
  $('tOpcoes').hidden = $('opcoes').hidden = !cs.opcoes.length;
  $('opcoes').innerHTML = lista(cs.opcoes);
  $('tBanco').hidden = false;
  $('banco').innerHTML = lista(cs.banco) || '<div style="color:var(--fraco);grid-column:1/-1">Banco vazio por enquanto.</div>';
}

function render() {
  $('ponto').className = S.lol ? 'on' : '';
  $('fila').textContent = (tipo && tipo !== 'auto' ? TIPOS[tipo] : S.fila) || 'Pick Automático';
  $('tipoBtn').textContent = tipo ? 'Trocar tipo' : 'Tipo';
  $('atualizar').hidden = !S.atualizar;
  if (S.atualizar) { $('atualizarLink').href = S.atualizar; $('atualizarLink').textContent = S.atualizar.replace('https://', ''); }
  const emCS = S.phase === 'ChampSelect' && S.cs;
  $('parado').hidden = S.phase === 'ReadyCheck' || !!emCS;
  $('pronto').hidden = S.phase !== 'ReadyCheck';
  $('cs').hidden = !emCS;
  if (!emCS) { $('rodape').hidden = true; acaoId = null; sel = 0; }

  if (!S.lol) $('parado').innerHTML = '<b>LoL fechado</b>Abra o cliente no PC.';
  else if (S.phase === 'Matchmaking') $('parado').innerHTML = '<b>Na fila…</b>Aviso assim que achar partida.';
  else if (S.phase === 'InProgress' || S.phase === 'GameStart') {
    const j = S.jogo;
    $('parado').innerHTML = '<b>Partida em andamento</b>' + (!j ? 'Bom jogo.' : `Você de ${esc(j.eu.nome)} contra:` +
      `<div class="time" style="margin:14px 0">${j.inimigos.map((p) => `<div class="jog inimigo locked"><div class="foto">${foto(p.id)}</div><small class="c">${esc(p.nome)}</small></div>`).join('')}</div>` +
      j.leitura.map((l) => `<div>${esc(l)}</div>`).join('') +
      (j.cuidado.length ? `<div style="color:#ff8b99">Cuidado na rota: ${esc(j.cuidado.join(', '))}</div>` : '') +
      (j.vantagem.length ? `<div style="color:var(--ok)">Você leva vantagem sobre: ${esc(j.vantagem.join(', '))}</div>` : ''));
  }
  else $('parado').innerHTML = '<b>Aguardando</b>Entre numa fila no PC.';

  if (S.phase === 'ReadyCheck') {
    $('tipos').hidden = true; // a pergunta nao pode tampar o ACEITAR
    $('prontoFila').textContent = S.fila || '';
    $('aceitar').disabled = !!S.aceito;
    $('aceitar').textContent = S.aceito ? 'ACEITO ✓' : 'ACEITAR';
  }
  if (!emCS) return;

  const cs = S.cs;
  const modo = modoDe(cs);
  $('meuTime').innerHTML = cs.meuTime.map((p) => jogador(p, false)).join('');
  const temInimigo = cs.inimigos.some((p) => p.champ || p.intent) || cs.bans.deles.length;
  $('blocoInimigo').hidden = modo === 'aram' || !temInimigo;
  $('inimigos').innerHTML = cs.inimigos.map((p) => jogador(p, true)).join('');
  const bans = (ids, txt) => (ids.length ? txt + ids.map(foto).join('') : '');
  $('bansMeus').innerHTML = bans(cs.bans.meus, 'Bans do seu time ');
  $('bansDeles').innerHTML = bans(cs.bans.deles, 'Bans deles ');

  $('aram').hidden = modo !== 'aram';
  $('draft').hidden = modo !== 'draft';
  if (modo === 'aram') renderAram(cs); else renderDraft(cs);
}

// tipo de partida: pergunta ao abrir e pelo botao do topo
$('tipos').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tipo]'); if (!b) return;
  tipo = b.dataset.tipo; $('tipos').hidden = true; gradeSig = ''; render();
});
$('tipoBtn').addEventListener('click', () => { $('tipos').hidden = false; });

// lembrete de instalar (some quando ja abriu pela tela inicial)
try {
  const instalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('instalar').hidden = instalado || localStorage.getItem('instalarVisto') === '1';
} catch {}
$('instalarX').addEventListener('click', () => { $('instalar').hidden = true; try { localStorage.setItem('instalarVisto', '1'); } catch {} });

// toques
function marcar(id) {
  if (!S.cs) return;
  sel = id; gradeSig = ''; render();
  api('hover', { championId: id });
}
$('grade').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) marcar(Number(b.dataset.id)); });
$('sugestoes').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) marcar(Number(b.dataset.id)); });
$('busca').addEventListener('input', () => { if (S.cs) renderDraft(S.cs); });
$('confirmar').addEventListener('click', async () => { $('confirmar').disabled = true; await api('lock', { championId: sel }); $('confirmar').disabled = false; });
$('aceitar').addEventListener('click', () => api('accept'));
$('dado').addEventListener('click', () => api('reroll'));
for (const id of ['opcoes', 'banco']) {
  $(id).addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) api('swap', { championId: Number(b.dataset.id) }); });
}

// relogio
setInterval(() => {
  const t = $('timer');
  if (S.phase !== 'ChampSelect' || !fimTimer) { t.textContent = ''; return; }
  const s = Math.max(0, Math.ceil((fimTimer - Date.now()) / 1000));
  t.textContent = s; t.className = s <= 10 ? 'pouco' : '';
}, 250);

// ao vivo
function ligar() {
  const es = new EventSource('/events?k=' + encodeURIComponent(K));
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    fimTimer = S.left ? Date.now() + S.left : 0;
    if (S.lol && S.nChamps && S.nChamps !== champs.length) carregarChamps();
    render();
  };
  es.onerror = () => { $('ponto').className = ''; };
}
if (!K) $('parado').innerHTML = '<b>Sem chave</b>Abra pelo app Pick Automático ou pelo QR do PC.';
else { render(); ligar(); $('tipos').hidden = false; }
$('sinoBtn').onclick = () => lerSino(!sinoLigado);
lerSino();
</script>
</body>
</html>
