<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligar o app Pick Automático</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
  :root { --fundo: #010a13; --fundo2: #0a1428; --painel: #0e1b2e; --borda: #1e2d46; --ouro: #c8aa6e; --ouro-escuro: #785a28; --texto: #f0e6d2; --fraco: #a09b8c; --ok: #0ac8b9;
    --corte: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); --corte-p: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--texto); font: 17px/1.45 "Barlow Semi Condensed", Bahnschrift, "Segoe UI", sans-serif;
    background: radial-gradient(90% 60% at 50% 0%, #12305a66, transparent 60%), linear-gradient(180deg, var(--fundo2), var(--fundo)); }
  /* cartao com moldura dourada e cantos cortados, como os botoes do cliente do LoL */
  .cartao { width: min(480px, 94vw); padding: 2px; clip-path: var(--corte); background: linear-gradient(180deg, var(--ouro), var(--ouro-escuro)); }
  .cartao > .dentro { padding: 28px 28px 24px; text-align: center; clip-path: var(--corte); background: linear-gradient(180deg, #0b1a30, var(--fundo)); }
  h1 { font-size: 28px; font-weight: 700; margin: 4px 0 8px; }
  p { color: var(--fraco); margin: 0 0 18px; }
  small { color: var(--ok); font-weight: 600; font-size: 15px; }
  #qr { width: 300px; height: 300px; margin: 0 auto 18px; padding: 14px; background: #fff; clip-path: var(--corte-p); box-shadow: 0 0 0 3px var(--ouro); }
  #qr svg { width: 100%; height: 100%; display: block; }
  .linha { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  button { padding: 12px 20px; clip-path: var(--corte-p); border: 1px solid var(--ouro-escuro); background: var(--painel); color: var(--texto); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { border-color: var(--ouro); }
  button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  /* o botao que avanca: ouro do cliente, maior, com uma seta desenhada */
  button.p { position: relative; min-width: 190px; padding: 14px 44px 14px 26px; border: 0; font-size: 19px; font-weight: 700; letter-spacing: .03em; color: #1a1408;
    background: linear-gradient(180deg, #f0d79a, var(--ouro) 55%, var(--ouro-escuro)); box-shadow: inset 0 0 0 2px #f0e6d266; transition: filter .15s; }
  button.p::after { content: ""; position: absolute; right: 20px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border: solid #1a1408; border-width: 0 3px 3px 0; transform: rotate(-45deg); transition: right .15s; }
  button.p:hover { filter: brightness(1.12); }
  button.p:hover::after { right: 16px; }
  @media (prefers-reduced-motion: reduce) { button.p, button.p::after { transition: none; } }
  button.sel { border-color: var(--ouro); color: var(--ouro); background: #c8aa6e1a; }
  #status { margin-top: 14px; font-weight: 700; min-height: 1.5em; }
  #status.ok { color: var(--ok); }
  code { color: var(--fraco); font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
<div class="cartao">
<div class="dentro">
  <small id="n"></small>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <div id="lojas" class="linha" style="margin:0 0 16px"><button data-loja="android" class="sel">Android</button><button data-loja="iphone">iPhone</button></div>
  <div id="qr"></div>
  <div id="extra"></div>
  <div id="status"></div>
  <div class="linha"><button id="voltar">Voltar</button><button id="proximo" class="p">Próximo</button></div>
</div>
</div>
<script src="/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let info = null, passo = 0, loja = 'android', fim = false;

function qr(texto) {
  const q = qrcode(0, 'M');
  q.addData(texto); q.make();
  $('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}

function render() {
  $('voltar').hidden = passo === 0 || fim;
  $('lojas').hidden = passo !== 0 || fim;
  $('status').textContent = ''; $('status').className = '';
  $('extra').innerHTML = '';
  if (fim) {
    $('n').textContent = 'PRONTO'; $('titulo').textContent = 'Tudo ligado'; $('qr').hidden = true;
    $('texto').textContent = 'Pode fechar esta aba. O Pick Automático fica rodando escondido no PC, com o painel no canto da tela.';
    $('proximo').textContent = 'Fechar'; return;
  }
  if (loja === 'iphone') {
    $('n').textContent = 'IPHONE';
    $('titulo').textContent = 'Abra o site no iPhone';
    $('texto').textContent = 'No iPhone o Pick Automático é um site. Aponte a câmera (iPhone no mesmo Wi-Fi do PC), abra o link e toque em Compartilhar → "Adicionar à Tela de Início". O site mostra a partida e o botão de aceitar quando estiver aberto.';
    qr(info.link); $('qr').hidden = false;
    $('extra').innerHTML = `<code>${info.link}</code>`;
    $('proximo').textContent = 'Concluir';
    return;
  }
  if (passo === 0) {
    $('n').textContent = 'ANDROID · PASSO 1 DE 2';
    $('titulo').textContent = 'Instale o app no celular';
    if (info.baixarApp) {
      $('texto').textContent = 'Aponte a câmera do celular (no mesmo Wi-Fi do PC) e baixe o PickAutomatico.apk. Ao abrir, o Android pede para permitir instalar apps desta fonte: permita. Já tem o app? Vá em Próximo.';
      qr(info.baixarApp); $('qr').hidden = false;
    } else {
      $('texto').textContent = 'O app ainda não foi gerado neste PC (falta o arquivo app\PickAutomatico.apk).';
      $('qr').hidden = true;
    }
    $('proximo').textContent = 'Próximo';
  } else {
    $('n').textContent = 'ANDROID · PASSO 2 DE 2';
    $('titulo').textContent = 'Ligue o app a este PC';
    $('texto').textContent = 'No app, toque em "Escanear o QR do PC" e aponte para este código. Depois disso os avisos chegam em qualquer rede, e as opções do LoL ficam no app.';
    qr(info.conectarApp); $('qr').hidden = false;
    $('proximo').textContent = 'Concluir';
  }
}

$('lojas').addEventListener('click', (e) => {
  const b = e.target.closest('[data-loja]'); if (!b) return;
  loja = b.dataset.loja;
  document.querySelectorAll('[data-loja]').forEach((x) => x.classList.toggle('sel', x === b));
  render();
});
$('voltar').addEventListener('click', () => { passo = 0; render(); });
$('proximo').addEventListener('click', async () => {
  if (fim) return window.close();
  if (loja === 'android' && passo === 0) { passo = 1; return render(); }
  await fetch('/api/pc?acao=concluir', { method: 'POST' });
  fim = true; render();
});

setInterval(async () => {
  try {
    const r = await (await fetch('/api/pc')).json();
    if (!fim && loja === 'android' && passo === 1 && r.appVisto) { $('status').textContent = 'App conectado ✓'; $('status').className = 'ok'; }
  } catch {}
}, 1500);

fetch('/api/pc').then((r) => r.json()).then((j) => { info = j; render(); });
</script>
</body>
</html>
