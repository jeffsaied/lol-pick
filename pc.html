<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligar o app Pick Automático</title>
<style>
  :root { --fundo: #0a1018; --painel: #121c28; --borda: #26334d; --ouro: #c8aa6e; --texto: #e8e3d5; --fraco: #8696a8; --ok: #2ecc71; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font: 16px/1.45 system-ui, sans-serif; }
  .cartao { width: min(460px, 94vw); background: var(--painel); border: 1px solid var(--borda); border-radius: 18px; padding: 26px; text-align: center; }
  h1 { font-size: 22px; margin: 6px 0 8px; }
  p { color: var(--fraco); margin: 0 0 16px; }
  small { color: var(--ouro); font-weight: 700; letter-spacing: .08em; }
  #qr { width: 300px; height: 300px; margin: 0 auto 16px; padding: 14px; background: #fff; border-radius: 16px; }
  #qr svg { width: 100%; height: 100%; display: block; }
  .linha { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  button { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--borda); background: transparent; color: var(--texto); font: inherit; font-weight: 600; cursor: pointer; }
  button.p { background: var(--ouro); border-color: var(--ouro); color: #1a1408; }
  button.sel { border-color: var(--ouro); color: var(--ouro); }
  #status { margin-top: 14px; font-weight: 700; min-height: 1.5em; }
  #status.ok { color: var(--ok); }
  code { color: var(--fraco); font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="cartao">
  <small id="n"></small>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <div id="lojas" class="linha" style="margin:0 0 16px"><button data-loja="android" class="sel">Android</button><button data-loja="iphone">iPhone</button></div>
  <div id="qr"></div>
  <div id="extra"></div>
  <div id="status"></div>
  <div class="linha"><button id="voltar">Voltar</button><button id="proximo" class="p">Próximo</button></div>
</div>
<script src="/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let info = null, passo = 0, loja = 'android', fim = false;

function qr(texto) {
  const q = qrcode(0, 'M');
  q.addData(texto); q.make();
  $('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}

function render() {
  $('voltar').hidden = passo === 0 || fim;
  $('lojas').hidden = passo !== 0 || fim;
  $('status').textContent = ''; $('status').className = '';
  $('extra').innerHTML = '';
  if (fim) {
    $('n').textContent = 'PRONTO'; $('titulo').textContent = 'Tudo ligado'; $('qr').hidden = true;
    $('texto').textContent = 'Pode fechar esta aba. O Pick Automático fica rodando escondido no PC, com o painel no canto da tela.';
    $('proximo').textContent = 'Fechar'; return;
  }
  if (loja === 'iphone') {
    $('n').textContent = 'IPHONE';
    $('titulo').textContent = 'Abra o site no iPhone';
    $('texto').textContent = 'No iPhone o Pick Automático é um site. Aponte a câmera (iPhone no mesmo Wi-Fi do PC), abra o link e toque em Compartilhar → "Adicionar à Tela de Início". O site mostra a partida e o botão de aceitar quando estiver aberto.';
    qr(info.link); $('qr').hidden = false;
    $('extra').innerHTML = `<code>${info.link}</code>`;
    $('proximo').textContent = 'Concluir';
    return;
  }
  if (passo === 0) {
    $('n').textContent = 'ANDROID · PASSO 1 DE 2';
    $('titulo').textContent = 'Instale o app no celular';
    if (info.baixarApp) {
      $('texto').textContent = 'Aponte a câmera do celular (no mesmo Wi-Fi do PC) e baixe o PickAutomatico.apk. Ao abrir, o Android pede para permitir instalar apps desta fonte: permita. Já tem o app? Vá em Próximo.';
      qr(info.baixarApp); $('qr').hidden = false;
    } else {
      $('texto').textContent = 'O app ainda não foi gerado neste PC (falta o arquivo app\PickAutomatico.apk).';
      $('qr').hidden = true;
    }
    $('proximo').textContent = 'Próximo';
  } else {
    $('n').textContent = 'ANDROID · PASSO 2 DE 2';
    $('titulo').textContent = 'Ligue o app a este PC';
    $('texto').textContent = 'No app, toque em "Escanear o QR do PC" e aponte para este código. Depois disso os avisos chegam em qualquer rede, e as opções do LoL ficam no app.';
    qr(info.conectarApp); $('qr').hidden = false;
    $('proximo').textContent = 'Concluir';
  }
}

$('lojas').addEventListener('click', (e) => {
  const b = e.target.closest('[data-loja]'); if (!b) return;
  loja = b.dataset.loja;
  document.querySelectorAll('[data-loja]').forEach((x) => x.classList.toggle('sel', x === b));
  render();
});
$('voltar').addEventListener('click', () => { passo = 0; render(); });
$('proximo').addEventListener('click', async () => {
  if (fim) return window.close();
  if (loja === 'android' && passo === 0) { passo = 1; return render(); }
  await fetch('/api/pc?acao=concluir', { method: 'POST' });
  fim = true; render();
});

setInterval(async () => {
  try {
    const r = await (await fetch('/api/pc')).json();
    if (!fim && loja === 'android' && passo === 1 && r.appVisto) { $('status').textContent = 'App conectado ✓'; $('status').className = 'ok'; }
  } catch {}
}, 1500);

fetch('/api/pc').then((r) => r.json()).then((j) => { info = j; render(); });
</script>
</body>
</html>
